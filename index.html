<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop 性格原型测试</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, 'PingFang SC', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; overflow: hidden; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px; height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  
  .hero { text-align: center; padding: 40px 0; }
  .hero h1 { font-size: 26px; margin: 0 0 12px; background: linear-gradient(135deg, #ff3366, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: #888; font-size: 14px; line-height: 1.6; margin: 0 0 30px; }
  .code-input { width: 100%; padding: 18px; font-size: 26px; letter-spacing: 8px; text-align: center; text-transform: uppercase; border: 2px solid #222; background: #151515; color: #fff; border-radius: 12px; outline: none; }
  .code-input:focus { border-color: #ff3366; }
  .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff3366, #ff6b9d); color: #fff; font-weight: bold; border: none; border-radius: 12px; font-size: 17px; cursor: pointer; margin-top: 16px; }
  .btn-primary:disabled { opacity: 0.5; }
  .msg { color: #ff4444; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
  
  .gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .gen-card { background: #151515; border: 1.5px solid #222; border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; transition: 0.2s; }
  .gen-card:hover { border-color: #ff3366; background: #1a1015; }
  .gen-card h3 { margin: 0 0 8px; font-size: 16px; color: #ff6b9d; }
  .gen-card .info-link { display: block; margin-top: 10px; font-size: 11px; color: #ff6b9d; text-decoration: underline; }
  
  .quiz-header { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 16px; }
  .progress { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #ff3366, #ff6b9d); width: 0%; transition: width 0.4s; }
  .q-text { font-size: 18px; line-height: 1.6; font-weight: 600; margin-bottom: 24px; }
  .opt { width: 100%; padding: 14px; background: #151515; border: 1.5px solid #222; color: #fff; border-radius: 10px; margin-bottom: 10px; text-align: left; cursor: pointer; font-size: 14px; line-height: 1.5; }
  .opt:hover { border-color: #ff3366; }
  .opt.selected { border-color: #ff3366; background: #2a1018; }
  .quiz-nav { display: flex; gap: 10px; margin-top: 8px; }
  .btn-secondary { flex: 1; padding: 14px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 12px; font-size: 15px; cursor: pointer; }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

  .result-container { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -ms-overflow-style: none; position: relative; }
  .result-container::-webkit-scrollbar { display: none; }
  
  .page-card { min-height: 100%; scroll-snap-align: start; background: #151515; border: 1px solid #2a2a2a; border-radius: 20px; padding: 30px 24px 60px 24px; margin-bottom: 20px; position: relative; display: flex; flex-direction: column; }
  .page-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ff3366, #ff6b9d); border-radius: 20px 20px 0 0; }
  .test-index-tag { position: absolute; top: 15px; right: 15px; background: rgba(255,51,102,0.15); color: #ff6b9d; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }

  .a-page-title { font-size: 12px; color: #ff6b9d; letter-spacing: 2px; text-align: center; margin-bottom: 20px; }
  .a-page-name { font-size: 32px; font-weight: 800; text-align: center; margin: 0 0 10px; background: linear-gradient(135deg, #fff, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .a-page-desc { font-size: 18px; font-weight: bold; text-align: center; color: #fff; margin: 0 0 20px; }
  .radar-box { background: #0f0f0f; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: center; flex-shrink: 0; }
  .radar-box h4 { margin: 0 0 15px; font-size: 14px; color: #ff6b9d; }
  canvas { max-width: 100%; height: auto; }
  .a-page-summary { font-size: 14px; color: #aaa; line-height: 1.6; text-align: center; background: rgba(255,51,102,0.05); padding: 12px; border-radius: 8px; border-left: 3px solid #ff3366; }
  
  .b-page-desc-large { font-size: 28px; font-weight: 900; text-align: center; color: #fff; margin: 0 0 25px; line-height: 1.3; letter-spacing: 1px; background: linear-gradient(135deg, #fff, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .b-page-dimensions-list { display: flex; flex-direction: column; gap: 20px; flex: 1; overflow-y: auto; }
  .b-dim-section { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; border-left: 3px solid #ff3366; }
  .b-dim-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .b-dim-text { font-size: 14px; color: #ccc; line-height: 1.6; }
  .b-page-name-small { font-size: 13px; text-align: center; color: #555; margin-top: 25px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; }
  
  .c-page-title { font-size: 18px; font-weight: bold; color: #ff6b9d; text-align: center; margin: 0 0 25px; }
  .dim-block { margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 20px; }
  .dim-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .dim-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dim-name-score { font-size: 15px; font-weight: bold; color: #fff; }
  .dim-champion { font-size: 14px; font-weight: bold; color: #ff6b9d; }
  .bar-container { width: 100%; height: 10px; background: transparent; border: 1px solid #ff3366; border-radius: 5px; margin: 10px 0; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; background: #ff3366; border-radius: 5px; }
  .dim-desc-text { font-size: 12px; color: #888; line-height: 1.5; margin-top: 8px; }
  
  #scrollNav { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 100; }
  .scroll-btn { width: 44px; height: 44px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; opacity: 0; pointer-events: none; transform: scale(0.8); }
  .scroll-btn.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
  .scroll-btn:hover { background: rgba(255, 51, 102, 0.25); border-color: #ff3366; }
  .scroll-btn svg { width: 24px; height: 24px; fill: #fff; }

  .share-hint { margin-top: auto; padding-top: 20px; text-align: center; border-top: 1px dashed #333; }
  .share-hint p { color: #ff6b9d; font-size: 14px; font-weight: bold; margin: 0 0 4px; }
  .share-hint small { color: #666; font-size: 11px; }
  .poster-footer { text-align: center; font-size: 11px; color: #555; margin-top: 10px; }
  .status-badge { display: inline-block; padding: 4px 12px; background: rgba(255,51,102,0.15); color: #ff6b9d; border-radius: 20px; font-size: 12px; margin-top: 12px; }
  .gen-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .gen-tab { padding: 6px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; font-size: 12px; cursor: pointer; color: #888; transition: 0.2s; }
  .gen-tab.active { border-color: #ff3366; color: #fff; background: rgba(255,51,102,0.2); }
  .confirm-box, .calc-box { text-align: center; padding: 50px 0; }
  .calc-box .spinner { font-size: 50px; margin-bottom: 30px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .calc-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin: 20px 0; }
  .calc-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3366, #ff6b9d); border-radius: 3px; }
</style>
</head>
<body>
  <div id="scrollNav" class="hidden">
    <div class="scroll-btn scroll-up" onclick="scrollPage(-1)" title="上一页"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></div>
    <div class="scroll-btn scroll-down" onclick="scrollPage(1)" title="下一页"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div>
  </div>

  <div class="wrap">
    <div id="page-input">
      <div class="hero">
        <h1>✨ 解锁你的 K-pop 灵魂原型</h1>
        <p>深度情境测试 · 匹配你的本命 Idol 人格<br>输入授权码开始测试或查看已生成的档案</p>
        <input type="text" id="codeInput" class="code-input" maxlength="6" placeholder="输入 6 位授权码" autocomplete="off">
        <button class="btn-primary" id="checkBtn" onclick="checkCode()">开始测试</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div id="page-gen" class="hidden">
      <div class="hero" style="padding:30px 0;">
        <h1>选择你的测试宇宙</h1>
        <p>每个宇宙包含该时代最具代表性的女团原型<br><span id="genRemainHint" style="color:#ff6b9d;"></span></p>
      </div>
      <div class="gen-grid">
        <div class="gen-card" onclick="selectGen('gen2')"><h3>二代 · 情怀考古</h3><a href="gen2.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a></div>
        <div class="gen-card" onclick="selectGen('gen3')"><h3>三代 · 个性顶流</h3><a href="gen3.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a></div>
        <div class="gen-card" onclick="selectGen('gen4')"><h3>四代 · 流量主力</h3><a href="gen4.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a></div>
        <div class="gen-card" onclick="selectGen('gen5')"><h3>五代 · 新粉选秀</h3><a href="gen5.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a></div>
      </div>
      <button class="btn-secondary" id="viewResultBtn" style="display:none; margin-top:16px;" onclick="showResultView()">📂 查看已测代际结果</button>
    </div>

    <div id="page-quiz" class="hidden">
      <div class="quiz-header"><span>题目 <span id="qNum">1</span> / 20</span><span id="remainHint" style="color:#ff6b9d;"></span></div>
      <div class="progress"><div class="progress-fill" id="prog"></div></div>
      <div class="q-text" id="qText"></div>
      <div id="opts"></div>
      <div class="quiz-nav">
        <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
        <button class="btn-secondary" id="nextBtn" onclick="nextQuestion()" disabled>下一题 →</button>
      </div>
    </div>

    <div id="page-confirm" class="hidden">
      <div class="confirm-box">
        <div style="font-size:60px; margin-bottom:20px;">🎯</div>
        <h2>你已完成全部 20 题</h2>
        <p style="color:#888; font-size:14px; line-height:1.6; margin:0 0 30px;">系统将解析你的 5 维性格向量，<br>在候选原型中匹配你的本命 Idol。</p>
        <button class="btn-primary" onclick="startCalc()">开始测算</button>
        <button class="btn-secondary" style="margin-top:10px;" onclick="backToLastQ()">返回检查答案</button>
      </div>
    </div>

    <div id="page-calc" class="hidden">
      <div class="calc-box">
        <div class="spinner">💫</div>
        <h2 style="margin:0 0 10px;">正在生成你的专属档案</h2>
        <div class="calc-bar"><div class="calc-fill" id="calcFill"></div></div>
        <div id="calcText" style="color:#ff6b9d; font-size:14px; min-height:20px;">正在解析你的 20 个选择...</div>
        <div id="calcPct" style="color:#666; font-size:12px; margin-top:8px;">0%</div>
      </div>
    </div>

    <div id="page-result" class="hidden">
      <div class="gen-tabs" id="genTabs"></div>
      <div class="result-container" id="resultContent"></div>
      <p style="text-align:center; color:#666; font-size:13px; margin:20px 0;">👆 长按上方卡片保存海报</p>
      <div id="statusArea" style="text-align:center;"></div>
      <button class="btn-secondary" style="margin-top:10px;" onclick="location.reload()">返回首页</button>
    </div>
  </div>

<script>
const DIM_NAMES = ['E 能量', 'T 理性', 'D 自律', 'A 野心', 'C 共情'];
const DIM_FULL = {

    { q: "宿舍里室友因为小事吵架，你会？", opts: [{ t: "主动当和事佬，分别安慰两边", s: [2, 2, 3, 1, 4] }, { t: "默默戴上耳机，假装没听见", s: [1, 3, 3, 1, 2] }, { t: "直接指出谁对谁错，理性分析", s: [2, 4, 3, 3, 2] }, { t: "讲个笑话或搞怪，转移注意力", s: [4, 2, 2, 2, 3] }] },
    { q: "面对网络上的 Anti 粉丝（黑粉），你会？", opts: [{ t: "感到难过，但会默默努力用舞台反击", s: [2, 2, 4, 3, 3] }, { t: "完全不在意，甚至觉得是热度", s: [3, 3, 2, 4, 2] }, { t: "让公司发律师函，理性维权", s: [2, 4, 3, 4, 2] }, { t: "在粉丝见面会上温柔回应，感化他们", s: [2, 2, 3, 1, 4] }] },

    { q: "回归期连续熬夜打歌，身体到达极限时，你会？", opts: [{ t: "吞下止痛药，镜头前依然保持完美表情", s: [3, 3, 4, 3, 2] }, { t: "后台抱怨好累，上台瞬间像换了个人爆发", s: [4, 2, 2, 3, 2] }, { t: "担心队友，主动帮她们分担走位递水", s: [2, 2, 3, 1, 4] }, { t: "心里盘算结束后怎么狠狠休息，继续坚持", s: [3, 4, 4, 2, 2] }] },

const GEN_NAMES = { gen2: '二代', gen3: '三代', gen4: '四代', gen5: '五代' };
let currentCode = '', currentGen = '', remaining = 0, serverResults = [], currentHistoryIndex = 0, answers = new Array(20).fill(null), currentQ = 0;

function show(id) {
  document.querySelectorAll('.wrap > div').forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  const scrollNav = document.getElementById('scrollNav');
  if (id === 'page-result') { scrollNav.classList.remove('hidden'); setTimeout(initScrollButtons, 100); } 
  else { scrollNav.classList.add('hidden'); }
}
function showMsg(text) { document.getElementById('msg').innerText = text; }

async function checkCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (code.length !== 6) return showMsg('请输入完整的 6 位授权码');
  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.innerText = '验证中...'; showMsg('');
  try {
    const res = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) throw new Error("后端未正常响应");
    const data = await res.json();
    if (data.error) { showMsg(data.error); btn.disabled = false; btn.innerText = '开始测试'; return; }
    currentCode = code;
    remaining = data.remaining;
    serverResults = Array.isArray(data.results) ? data.results : [];
    if (remaining > 0) {
      document.getElementById('genRemainHint').innerText = `剩余 ${remaining} 次测试机会`;
      document.getElementById('viewResultBtn').style.display = serverResults.length > 0 ? 'block' : 'none';
      show('page-gen');
    } else {
      if (serverResults.length > 0) { currentHistoryIndex = serverResults.length - 1; showResultView(); } 
      else { showMsg('该授权码测试次数已用完，且无历史记录'); btn.disabled = false; btn.innerText = '开始测试'; }
    }
  } catch (e) { console.error(e); showMsg('请求失败: ' + e.message); btn.disabled = false; btn.innerText = '开始测试'; }
}

function selectGen(gen) {
  if (remaining <= 0) return alert('测试次数已用完，无法再次测试');
  currentGen = gen; answers = new Array(20).fill(null); currentQ = 0;
  document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`;
  show('page-quiz'); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentGen][currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('qText').innerText = q.q;
  document.getElementById('prog').style.width = `${(currentQ / 20) * 100}%`;
  document.getElementById('prevBtn').disabled = (currentQ === 0);
  document.getElementById('nextBtn').disabled = (answers[currentQ] === null);
  const container = document.getElementById('opts'); container.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[currentQ] === idx ? ' selected' : '');
    btn.innerText = opt.t; btn.onclick = () => selectOption(idx);
    container.appendChild(btn);
  });
}

function selectOption(idx) { answers[currentQ] = idx; renderQuestion(); }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function nextQuestion() { if (answers[currentQ] === null) return; currentQ++; if (currentQ < 20) renderQuestion(); else show('page-confirm'); }
function backToLastQ() { currentQ = 19; document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`; show('page-quiz'); renderQuestion(); }

function startCalc() {
  show('page-calc');
  const fill = document.getElementById('calcFill'), pct = document.getElementById('calcPct'), txt = document.getElementById('calcText');
  const steps = ['正在解析你的 20 个选择...', '构建 5 维性格向量场...', '扫描候选原型人格图谱...', '计算多维空间共振频率...', '生成专属档案海报...'];
  let p = 0, lastSi = -1;
  fill.style.width = '0%'; pct.innerText = '0%'; txt.innerText = steps[0];
  const iv = setInterval(() => {
    p += 100 / 30;
    if (p >= 100) { p = 100; clearInterval(iv); fill.style.width = '100%'; pct.innerText = '100%'; setTimeout(submitResult, 300); return; }
    fill.style.width = p + '%'; pct.innerText = Math.floor(p) + '%';
    const si = Math.min(steps.length - 1, Math.floor(p / 100 * steps.length));
    if (si !== lastSi) { txt.innerText = steps[si]; lastSi = si; }
  }, 100);
}

function calcScores() {
  const s = [0, 0, 0, 0, 0];
  answers.forEach((idx, i) => { if (idx != null) { const opt = questions[currentGen][i].opts[idx]; for (let j = 0; j < 5; j++) s[j] += opt.s[j]; } });
  return s;
}

async function submitResult() {
  const userScores = calcScores();
  let bestMatch = idols[currentGen][0], minDiff = Infinity;
  idols[currentGen].forEach(idol => {
    let diff = 0; for (let i = 0; i < 5; i++) diff += Math.pow(userScores[i] - idol.scores[i], 2);
    if (diff < minDiff) { minDiff = diff; bestMatch = idol; }
  });
  const dimChampions = [];
  for (let i = 0; i < 5; i++) {
    let bestIdol = idols[currentGen][0], minD = Infinity;
    idols[currentGen].forEach(idol => { const d = Math.abs(userScores[i] - idol.scores[i]); if (d < minD) { minD = d; bestIdol = idol; } });
    dimChampions.push(bestIdol);
  }
  const resultData = { name: bestMatch.name, desc: bestMatch.desc, summary: bestMatch.summary, details: bestMatch.details, scores: userScores, dimChampions: dimChampions.map(id => id.name), matched_at: new Date().toISOString() };
  try {
    const res = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: currentCode, gen: currentGen, resultData }) });
    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) throw new Error("后端保存失败 (请检查 KV 绑定)");
    const data = await res.json();
    if (data.success) { remaining = data.remaining; serverResults.push({ gen: currentGen, result: data.result }); showResultView(); } 
    else { alert('保存失败：' + data.error); location.reload(); }
  } catch (e) { console.error("Save API Error:", e); alert('请求失败: ' + e.message + '\n\n💡 提示'); location.reload(); }
}

function showResultView() {
  currentHistoryIndex = serverResults.length - 1; renderTabs(); renderCurrentHistory();
  const statusArea = document.getElementById('statusArea');
  if (remaining > 0) { statusArea.innerHTML = `<div class="status-badge">剩余 ${remaining} 次测试机会</div><br><button class="btn-primary" style="margin-top:16px;" onclick="show('page-gen')">继续测试其他代际</button><button class="btn-secondary" style="margin-top:10px;" onclick="location.reload()">返回首页</button>`; } 
  else { statusArea.innerHTML = `<div class="status-badge">测试次数已用完 · 最终档案</div><br><button class="btn-secondary" style="margin-top:16px;" onclick="location.reload()">返回首页</button>`; }
  show('page-result');
}

function renderTabs() {
  const tabs = document.getElementById('genTabs'); tabs.innerHTML = '';
  if (serverResults.length <= 1) return;
  serverResults.forEach((record, index) => {
    const t = document.createElement('div');
    t.className = 'gen-tab' + (index === currentHistoryIndex ? ' active' : '');
    t.innerText = `第 ${index + 1} 次 (${GEN_NAMES[record.gen] || record.gen})`;
    t.onclick = () => { currentHistoryIndex = index; renderTabs(); renderCurrentHistory(); document.querySelector('.result-container').scrollTop = 0; };
    tabs.appendChild(t);
  });
}

function renderCurrentHistory() {
  const container = document.getElementById('resultContent'); container.innerHTML = '';
  const record = serverResults[currentHistoryIndex], r = record.result;
  const dimKeys = ['E', 'T', 'D', 'A', 'C'], maxScore = 80;
  let bPageHtml = '';
  if (r.details) {
    bPageHtml = `<div class="b-page-dimensions-list"><div class="b-dim-section"><div class="b-dim-title">⚡ 能量外放</div><div class="b-dim-text">${r.details.E}</div></div><div class="b-dim-section"><div class="b-dim-title">🧠 理性逻辑</div><div class="b-dim-text">${r.details.T}</div></div><div class="b-dim-section"><div class="b-dim-title">🎯 自律努力</div><div class="b-dim-text">${r.details.D}</div></div><div class="b-dim-section"><div class="b-dim-title">🔥 野心攻击</div><div class="b-dim-text">${r.details.A}</div></div><div class="b-dim-section"><div class="b-dim-title">💖 共情照顾</div><div class="b-dim-text">${r.details.C}</div></div></div><div class="b-page-name-small">—— 匹配原型：${r.name} ——</div>`;
  }
  let dimHtml = '';
  for (let i = 0; i < 5; i++) {
    const key = dimKeys[i], full = DIM_FULL[key], championName = r.dimChampions ? r.dimChampions[i] : '未知', score = r.scores[i], percent = (score / maxScore) * 100;
    let dimDetailText = (r.details && r.details[key]) ? r.details[key] : full.desc;
    dimHtml += `<div class="dim-block"><div class="dim-header-row"><span class="dim-name-score">${full.name} (得分: ${score})</span><span class="dim-champion">最像: ${championName}</span></div><div class="bar-container"><div class="bar-fill" style="width: ${percent}%;"></div></div><div class="dim-desc-text">💡 ${dimDetailText}</div></div>`;
  }
  container.innerHTML = `<div class="page-card"><div class="test-index-tag">第 ${currentHistoryIndex + 1} 次测试</div><div class="a-page-title">K-POP PERSONALITY ARCHIVE</div><h2 class="a-page-name">${r.name}</h2><div class="a-page-desc">${r.desc}</div><div class="radar-box"><h4>📊 五维人格雷达图</h4><canvas id="radarCanvas" width="340" height="340"></canvas></div><div class="a-page-summary"><strong>🔍 匹配依据：</strong>${r.summary || generateFallbackSummary(r.scores, r)}</div><div class="share-hint"><p>📸 长按上方区域截图保存</p><small>分享给朋友，看看是不是同一种灵魂</small></div></div><div class="page-card"><div class="test-index-tag">第 ${currentHistoryIndex + 1} 次测试</div><div class="b-page-desc-large">${r.desc}</div>${bPageHtml}<div class="share-hint"><p>📸 长按上方区域截图保存</p><small>你的独特魅力，值得被看见</small></div></div><div class="page-card"><div class="test-index-tag">第 ${currentHistoryIndex + 1} 次测试</div><div class="c-page-title">🧬 五维深度解析</div>${dimHtml}<div class="share-hint"><p>📸 长按上方区域截图保存</p><small>本档案基于你的选择生成 · 仅供趣味探索</small></div></div>`;
  setTimeout(() => { const canvas = document.getElementById('radarCanvas'); if (canvas) drawRadarOnCanvas(canvas, r.scores, r.dimChampions); }, 100);
}

function initScrollButtons() {
  const container = document.querySelector('.result-container'), upBtn = document.querySelector('.scroll-up'), downBtn = document.querySelector('.scroll-down');
  if (!container || !upBtn || !downBtn) return;
  const checkScroll = () => {
    const scrollTop = container.scrollTop, scrollHeight = container.scrollHeight, clientHeight = container.clientHeight;
    if (scrollTop > 50) upBtn.classList.add('visible'); else upBtn.classList.remove('visible');
    if (scrollTop < scrollHeight - clientHeight - 50) downBtn.classList.add('visible'); else downBtn.classList.remove('visible');
  };
  container.addEventListener('scroll', checkScroll); checkScroll();
}
function scrollPage(direction) { const container = document.querySelector('.result-container'); container.scrollBy({ top: direction * container.clientHeight, behavior: 'smooth' }); }

function generateFallbackSummary(scores, idol) { const maxDimIdx = scores.indexOf(Math.max(...scores)); return `你在${DIM_FULL[['E','T','D','A','C'][maxDimIdx]].name}维度表现突出，${idol.desc}，是团队中不可或缺的独特存在。`; }
function generateFallbackLongDetail(scores, idol) { let detail = `你的性格底色是${idol.desc}。`; if (scores[0] > 40) detail += "在社交中你充满活力；"; else detail += "在社交中你偏向内敛；"; if (scores[3] > 40) detail += "你对事业有着极强的野心；"; else detail += "你对待竞争相对佛系；"; detail += `综合来看，你拥有独特且迷人的特质。`; return detail; }

function drawRadarOnCanvas(canvas, scores, champions) {
  if (!canvas || !scores) return;
  const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, R = 75, maxScore = 80;
  ctx.clearRect(0, 0, w, h);
  for (let level = 1; level <= 5; level++) {
    const r = (R / 5) * level; ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = (Math.PI * 2 / 5) * i - Math.PI / 2; const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.closePath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
  }
  for (let i = 0; i < 5; i++) { const a = (Math.PI * 2 / 5) * i - Math.PI / 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); ctx.strokeStyle = '#444'; ctx.stroke(); }
  const points = []; ctx.beginPath();
  for (let i = 0; i < 5; i++) { const a = (Math.PI * 2 / 5) * i - Math.PI / 2; const r = (scores[i] / maxScore) * R; const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); points.push({ x, y, a }); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.closePath(); ctx.fillStyle = 'rgba(255,51,102,0.3)'; ctx.fill(); ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const p = points[i]; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fillStyle = '#ff3366'; ctx.fill();
    const cos = Math.cos(p.a); ctx.textAlign = (Math.abs(cos) < 0.2) ? 'center' : (cos > 0 ? 'right' : 'left');
    const tx = cx + (R + 18) * cos, ty = cy + (R + 18) * Math.sin(p.a);
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ff6b9d'; ctx.fillText(DIM_NAMES[i], tx, ty - 8);
    ctx.fillStyle = '#fff'; ctx.fillText(scores[i] + '分', tx, ty + 8);
    const nm = (champions && champions[i]) ? String(champions[i]).split(' ')[0] : '';
    if (nm) { const tx2 = cx + (R + 36) * cos, ty2 = cy + (R + 36) * Math.sin(p.a); ctx.font = '10px sans-serif'; ctx.fillStyle = '#888'; ctx.fillText(nm, tx2, ty2); }
  }
}

document.getElementById('codeInput').addEventListener('input', function(e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
document.getElementById('codeInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkCode(); });
</script>
